name: Release Integrity

on:
    push:
        branches: ["main", "production", "release/**"]
        tags: ["v*"]
    pull_request:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "integrity-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    integrity:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Validate public surface
              run: node scripts/verify-public.mjs
            - name: Verify published release convergence
              if: github.event_name == 'release'
              run: node scripts/verify-release.mjs "${{ github.event.release.tag_name }}"
